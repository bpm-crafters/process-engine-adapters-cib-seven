server:
  port: 8080

spring:
  application:
    name: Java CIB Seven Platform Embedded

springdoc:
  swagger-ui:
    try-it-out-enabled: true

dev:
  bpm-crafters:
    process-api:
      adapter:
        cib-seven-embedded:
          enabled: true
          service-tasks:
            delivery-strategy: embedded_scheduled
            worker-id: embedded-worker
            lock-time-in-seconds: 10
            execute-initial-pull-on-startup: true
            schedule-delivery-fixed-rate-in-seconds: 10
            retries: 3
            max-task-count: 100
            retry-timeout-in-seconds: 30
          user-tasks:
            delivery-strategy: embedded_scheduled
            execute-initial-pull-on-startup: true
            schedule-delivery-fixed-rate-in-seconds: 10
# The CIB seven webapp ships the new webclient (since 2.2.0), which requires a base64 JWT secret
# of at least 155 characters. DO NOT reuse this example secret in production.
cibseven:
  webclient:
    authentication:
      jwtSecret: "al/gEH0veB+E9mAezx1L10291Ao2uJIJVNaWP4pIe2GfsUgMs15KLWiHONt7Y3vQfXVkv9kK5APdpMmzcq9+eIV61RyQZ/Q+1RdpL6XkQXH6cSlY4CrqrSd72R0I8tcF0nPQSnl7SHCGxiCfCNJr8h+dn7NYfIBgXPu9F3cw"

camunda:
  bpm:
    webapp:
      index-redirect-enabled: false
    admin-user:
      id: admin
      password: admin
    filter:
      create: All
    auto-deployment-enabled: false
    default-serialization-format: application/json

logging:
  level:
    dev.bpmcrafters.processengineapi: DEBUG
    dev.bpmcrafters.processengineapi.adapter.cibseven.embedded.springboot: TRACE
